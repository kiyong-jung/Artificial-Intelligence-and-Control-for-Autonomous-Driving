# web_page/를 GitHub Pages로 올린다. main에 web_page/가 바뀌면 돌고, Actions 탭에서 직접 돌릴 수도 있다.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web_page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_page
      - id: deployment
        uses: actions/deploy-pages@v4
